name: "Close drive-by contributions"

permissions: {}

on:
  schedule:
    - cron: "30 1 * * *"

jobs:
  driveby-prs:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          only-pr-labels: ":car: driveby"
          stale-pr-label: ":car: driveby"
          remove-pr-stale-when-updated: false
          close-pr-message: "This pull request was closed because its description was still incomplete 2 days after an update was requested."
          days-before-pr-stale: -1
          days-before-pr-close: 2
          days-before-issue-stale: -1
          days-before-issue-close: -1
